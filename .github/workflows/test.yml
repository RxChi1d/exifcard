name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Branch protection requires the checks by name: "test (<os>)". The 3.14
    # jobs keep exactly that name so they stay the required gate; the 3.15
    # jobs are named apart and run alongside without being required.
    name: test (${{ matrix.os }}${{ matrix.python != '3.14' && format(', {0}', matrix.python) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Stated outright rather than left to each runner image, which moves
        # on its own schedule: macOS jumped to 3.15 while Linux stayed on 3.14,
        # and the same commit passed on one and failed to install on the other.
        python: ["3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --locked

      # jpegtran backs --lossless. It is optional, and the tests that use it
      # skip when it is absent, so only Linux installs it here.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libjpeg-turbo-progs

      # Every test runs on every platform, the pixel comparisons included. That
      # is the point of the renderer: its output does not depend on the machine,
      # so a reference recorded on one holds on all three, and this matrix is
      # what proves it still does.
      - run: uv run pytest -q

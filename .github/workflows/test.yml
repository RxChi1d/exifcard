name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      # jpegtran backs --lossless. It is optional, and the tests that use it
      # skip when it is absent, so only Linux installs it here.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libjpeg-turbo-progs

      # Every test runs on every platform, the pixel comparisons included. That
      # is the point of the renderer: its output does not depend on the machine,
      # so a reference recorded on one holds on all three, and this matrix is
      # what proves it still does.
      - run: uv run pytest -q

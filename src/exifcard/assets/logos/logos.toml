# Camera brand logos.
#
# Every file here is a wordmark taken from Wikimedia Commons under a public
# domain tag (PD-textlogo: plain lettering is below the threshold of
# originality, so no copyright subsists). The marks are still trademarks; this
# tool uses them nominatively, to identify the camera a photo was taken with.
#
# Rules are matched top to bottom. `make` is compared against the EXIF Make
# field after normalization (uppercased, corporate suffixes stripped).
# `model_prefix`, when present, must also match the start of the EXIF Model
# field -- Ricoh Imaging ships both RICOH- and PENTAX-branded bodies under one
# Make value, and the Model field is what tells them apart.
#
# A brand with no rule here falls back to its name set in type, which is a
# supported layout, not a failure. Phone makers are in that group on purpose.
#
# Most entries are wordmarks. Nikon, Leica and OM System have no wordmark in
# the public domain, so they use the square emblem the maker actually puts on
# the camera. Aligned by height like everything else, a square mark ends up
# roughly a sixth as wide as a wordmark; that is what those brands look like,
# and it is preferred here to spelling the name out in type.

[[logo]]
make = "SONY"
file = "sony.svg"
source = "https://commons.wikimedia.org/wiki/File:Sony_logo.svg"
license = "Public domain (PD-textlogo)"

[[logo]]
make = "FUJIFILM"
file = "fujifilm.svg"
source = "https://commons.wikimedia.org/wiki/File:Fujifilm_logo.svg"
license = "Public domain (PD-textlogo)"

